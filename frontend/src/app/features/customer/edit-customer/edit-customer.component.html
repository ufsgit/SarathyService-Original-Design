<div class="legacy-card">
  <div class="card-header">
    <div class="header-title">
      <i class="icon-menu">≡</i>
      <span>Edit Customer</span>
    </div>
    <a class="btn-list" routerLink="/staff/customer/list">List Customer</a>
  </div>

  <div class="card-body">
    <form (ngSubmit)="onSubmit()" class="legacy-form">
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <label>Customer Name :</label>
            <input type="text" [(ngModel)]="form.c_name" name="name" placeholder="Customer name" required>
          </div>

          <div class="form-group">
            <label>Address :</label>
            <textarea [(ngModel)]="form.c_address" name="address" placeholder="Your address" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label>Registration Number :</label>
            <input type="text" [(ngModel)]="form.c_reg_no" (ngModelChange)="form.c_reg_no = $event.toUpperCase()" style="text-transform: uppercase;" name="reg" placeholder="Registration no" required>
          </div>

          <div class="form-group">
            <label>Chassis No :</label>
            <input type="text" [(ngModel)]="form.c_chassis_no" name="chassis" placeholder="Chassis no" required>
          </div>

          <div class="form-group">
            <label>Model Name :</label>
            <app-searchable-select
              [(ngModel)]="form.model_name"
              name="model"
              [options]="modelOptions"
              placeholder="Select Model"
              required
            ></app-searchable-select>
          </div>
        </div>

        <div class="form-col">
          <div class="form-group">
            <label>GSTIN Number :</label>
            <input type="text" [(ngModel)]="form.gstin_no" (ngModelChange)="sanitizeGstinNo()" oninput="this.value=this.value.replace(/[^0-9a-z]/gi,'').slice(0,15).toUpperCase()" style="text-transform: uppercase;" name="gstin" placeholder="GSTIN" maxlength="15" pattern="[0-9A-Za-z]{1,15}" title="Enter up to 15 alphanumeric characters" autocomplete="off">
          </div>

          <div class="form-group">
            <label>Engine No :</label>
            <input type="text" [(ngModel)]="form.c_engine_no" name="engine" placeholder="Engine number" required>
          </div>

          <div class="form-group">
            <label>Contact No :</label>
            <input type="tel" [(ngModel)]="form.c_contact_no" (keydown)="blockNonNumericKey($event)" (paste)="blockNonNumericPaste($event)" (input)="onContactInput($event)" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" name="contact" placeholder="Contact no" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" title="Enter exactly 10 digits" autocomplete="off">
          </div>

          <div class="form-group">
            <label>Date Of Sale :</label>
            <input type="date" [(ngModel)]="form.c_sales_date" name="sale">
          </div>

          <div class="form-group">
            <label>Email Id :</label>
            <input type="email" [(ngModel)]="form.c_email" name="email" placeholder="Email-Id">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Update</button>
        <a class="btn-cancel" routerLink="/staff/customer/list">Cancel</a>
      </div>
    </form>
  </div>
</div>
