<div class="legacy-card">
  <div class="card-header">
    <div class="header-title">
      <i class="icon-menu">≡</i>
      <span>Add Insurance Company</span>
    </div>
    <a class="btn-list" routerLink="/admin/insurance/list">List Companies</a>
  </div>

  <div class="card-body">
    <form (ngSubmit)="onSubmit()" class="legacy-form">
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <label>Company Name :</label>
            <input type="text" [(ngModel)]="form.icompany_name" name="name" placeholder="Company name" required>
          </div>

          <div class="form-group">
            <label>GSTIN :</label>
            <input type="text" [(ngModel)]="form.icompany_gst" oninput="this.value=this.value.replace(/[^0-9a-z]/gi,'').slice(0,15).toUpperCase()" style="text-transform: uppercase;" name="gst" placeholder="GST number" maxlength="15" pattern="[0-9A-Za-z]{1,15}" title="Enter up to 15 alphanumeric characters" autocomplete="off">
          </div>
        </div>

        <div class="form-col">
          <div class="form-group">
            <label>Address :</label>
            <textarea [(ngModel)]="form.icompany_address" name="address" placeholder="Company address" rows="3"></textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Submit</button>
        <button type="reset" class="btn-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>
