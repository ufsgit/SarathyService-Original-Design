<div class="legacy-card" style="max-width:500px">
  <div class="card-header">
    <div class="header-title">
      <i class="icon-menu">≡</i>
      <span>Change Password</span>
    </div>
  </div>

  <div class="card-body">
    <form (ngSubmit)="onSubmit()" class="legacy-form">
      <div class="form-group">
        <label>Old Password :</label>
        <input type="password" [(ngModel)]="oldPassword" name="old" placeholder="Old password" required>
      </div>
      <div class="form-group">
        <label>New Password :</label>
        <input type="password" [(ngModel)]="newPassword" name="new" placeholder="New password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password :</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirm" placeholder="Confirm password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-submit">Update Password</button>
      </div>
    </form>
  </div>
</div>
