<div class="legacy-card">
  <div class="card-header">
    <div class="header-title">
      <i class="icon-menu">≡</i>
      <span>Vehicle Model List</span>
    </div>
    <a class="btn-list" routerLink="/admin/model/add" *ngIf="auth.isAdmin">Add Model</a>
  </div>

  <div class="card-body">
    <div class="search-container" style="margin-bottom: 15px; display: flex; gap: 10px;">
      <input type="text" [(ngModel)]="search" placeholder="Search by model, code..." class="form-control" style="max-width: 300px; padding: 5px;" (keyup.enter)="onSearch()">
      <button class="btn-action" style="padding: 5px 15px;" (click)="onSearch()">Search</button>
    </div>

    <div class="table-container">
      <table class="legacy-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Model Name</th>
            <th>Code</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of models; let i = index">
            <td>{{ (page - 1) * limit + i + 1 }}</td>
            <td>{{ e.mod_name }}</td>
            <td>{{ e.mod_code }}</td>
            <td>
              <div class="action-dropdown">
                <button class="btn-action">Action▾</button>
                <div class="action-content">
                  <a [routerLink]="['/admin/model/edit', e.model_id]">Edit</a>
                  <a (click)="del(e.model_id)" *ngIf="auth.isAdmin">Delete</a>
                </div>
              </div>
            </td>
          </tr>
          <tr *ngIf="models.length === 0">
            <td colspan="4" class="no-data">No models found</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-container" style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;" *ngIf="total > 0">
      <div style="color: #666; font-size: 14px;">
        Showing {{ (page - 1) * limit + 1 }} to {{ page * limit < total ? page * limit : total }} of {{ total }} entries
      </div>
      <div style="display: inline-flex; align-items: center; border-radius: 4px;">
        <button (click)="prevPage()" [disabled]="page === 1" style="background: transparent; border: none; padding: 6px 12px; color: #337ab7; cursor: pointer; font-size: 14px;">Previous</button>
        
        <ng-container *ngFor="let p of getPages()">
          <span *ngIf="p === '...'" style="padding: 6px 12px; color: #777;">...</span>
          <button *ngIf="p !== '...'" 
                  (click)="goToPage(p)" 
                  [ngStyle]="{'background': p === page ? '#e9ecef' : '#fff', 'color': p === page ? '#333' : '#337ab7', 'border': '1px solid #ddd', 'padding': '6px 12px', 'margin': '0 -1px 0 0', 'cursor': 'pointer', 'font-size': '14px'}">
            {{ p }}
          </button>
        </ng-container>

        <button (click)="nextPage()" [disabled]="page >= getLastPage()" style="background: transparent; border: none; padding: 6px 12px; color: #337ab7; cursor: pointer; font-size: 14px; margin-left: 1px;">Next</button>
      </div>
    </div>
  </div>
</div>
