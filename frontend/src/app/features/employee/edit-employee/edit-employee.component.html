<div class="legacy-card">
  <div class="card-header">
    <div class="header-title">
      <i class="icon-menu">≡</i>
      <span>Edit Employee</span>
    </div>
    <a class="btn-list" routerLink="/admin/employee/list">List Employees</a>
  </div>

  <div class="card-body">
    <form (ngSubmit)="onSubmit()" class="legacy-form">
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <label>Name :</label>
            <input type="text" [(ngModel)]="form.e_first_name" name="fname" placeholder="Employee name" required>
          </div>

          <div class="form-group">
            <label>Initial :</label>
            <input type="text" [(ngModel)]="form.emp_intial" name="initial" placeholder="Initial">
          </div>

          <div class="form-group">
            <label>Mobile :</label>
            <input type="text" [(ngModel)]="form.e_mobile" name="mobile" placeholder="Mobile number">
          </div>

          <div class="form-group">
            <label>Email :</label>
            <input type="email" [(ngModel)]="form.e_email" name="email" placeholder="Email address">
          </div>
        </div>

        <div class="form-col">
          <div class="form-group">
            <label>Designation :</label>
            <input type="text" [(ngModel)]="form.e_designation" name="desig" placeholder="Designation">
          </div>

          <div class="form-group">
            <label>Code :</label>
            <input type="text" [(ngModel)]="form.e_code" name="code" placeholder="Employee code">
          </div>

          <div class="form-group">
            <label>Branch :</label>
            <select [(ngModel)]="form.e_branch" name="branch">
              <option value="" disabled selected>Select Branch</option>
              <option *ngFor="let b of branches" [value]="b.branch_name">{{b.branch_name}}</option>
            </select>
          </div>

          <div class="form-group">
            <label>Address :</label>
            <textarea [(ngModel)]="form.e_address" name="addr" placeholder="Employee address" rows="2"></textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Update</button>
        <a class="btn-cancel" routerLink="/admin/employee/list">Cancel</a>
      </div>
    </form>
  </div>
</div>
